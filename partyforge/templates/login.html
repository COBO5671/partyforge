{% extends "base.html" %}
{% block title %}Organizer login · {{ app_name }}{% endblock %}
{% block content %}
<section class="auth-card card">
  <div class="eyebrow">Organizer access</div>
  <h1>Let’s make something fun.</h1>
  <p class="muted">Enter your host username and password.</p>
  <form method="post" class="stack">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Username
      <input name="username" autocomplete="username" placeholder="Your host username" required>
    </label>
    <label>Password
      <input type="password" name="password" required autofocus autocomplete="current-password">
    </label>
    <button type="submit">Log in</button>
  </form>
</section>
{% endblock %}
