{% extends "base.html" %}
{% block title %}My account · {{ app_name }}{% endblock %}
{% block content %}
<div class="page-heading"><div><div class="eyebrow">Host account</div><h1>{{ user.name }}</h1><p class="muted">Signed in as @{{ user.username }}</p></div></div>
<form method="post" class="card form-card stack">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <h2>Change password</h2>
  <label>Current password<input type="password" name="current_password" required autocomplete="current-password"></label>
  <label>New password<input type="password" name="new_password" required minlength="10" autocomplete="new-password"></label>
  <button type="submit">Change password</button>
</form>
{% endblock %}
